<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobhunt Dashboard - Neil Broes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function openTab(tabName) {
            // Verberg alle tab content
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.add('hidden');
            });
            // Reset alle tab knoppen
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('text-blue-600', 'border-blue-600');
                btn.classList.add('text-gray-500', 'border-transparent');
            });
            // Toon actieve tab en stijl knop
            document.getElementById(tabName).classList.remove('hidden');
            const activeBtn = document.getElementById('btn-' + tabName);
            activeBtn.classList.remove('text-gray-500', 'border-transparent');
            activeBtn.classList.add('text-blue-600', 'border-blue-600');
        }
    </script>
</head>
<body class="bg-gray-100 p-4 md:p-8 font-sans">
    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between pb-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-blue-900">Jobhunt Dashboard</h1>
                <p class="text-gray-600 text-sm mt-1">Overzicht loopbaancampagne Neil Broes | Senior Business Expert (CRM / Pricing / SAP SD)</p>
            </div>
            <div class="mt-4 md:mt-0 text-xs text-gray-500 bg-white px-3 py-2 rounded shadow-sm border border-gray-200 inline-block">
                <span class="text-emerald-600 font-bold">*</span> = Nieuw of recent gewijzigde status
            </div>
        </div>

        <!-- Tab Navigatie (Horizontaal scrollbaar op kleine schermen) -->
        <div class="border-b border-gray-300 overflow-x-auto">
            <nav class="-mb-px flex space-x-6 md:space-x-8 min-w-max px-2">
                <button id="btn-sollicitaties" onclick="openTab('sollicitaties')" class="tab-btn py-4 px-1 border-b-2 font-medium text-sm text-blue-600 border-blue-600 transition-colors">
                    🎯 Sollicitaties & Netwerk
                </button>
                <button id="btn-profiel" onclick="openTab('profiel')" class="tab-btn py-4 px-1 border-b-2 font-medium text-sm text-gray-500 border-transparent hover:text-gray-700 hover:border-gray-300 transition-colors">
                    👤 Profiel & Positionering
                </button>
                <button id="btn-opleidingen" onclick="openTab('opleidingen')" class="tab-btn py-4 px-1 border-b-2 font-medium text-sm text-gray-500 border-transparent hover:text-gray-700 hover:border-gray-300 transition-colors">
                    🎓 Opleidingen & Groei
                </button>
            </nav>
        </div>

        <!-- ==================== TAB 1: SOLLICITATIES ==================== -->
        <div id="sollicitaties" class="tab-content block space-y-6">
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Sollicitatie Pijplijn -->
                <div class="bg-white p-5 md:p-6 rounded-lg shadow-md border-t-4 border-blue-500">
                    <h2 class="text-xl font-bold mb-4 text-blue-700">🎯 Sollicitatie Pijplijn & Status</h2>
                    <ul class="space-y-3">
                        <li class="p-3.5 bg-orange-50 rounded border border-orange-200 shadow-sm">
