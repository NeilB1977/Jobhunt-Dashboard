on:
  push:
    branches: [ main ]  # Start direct als je code of data pusht naar de main branch
  schedule:
    - cron: '0 0 * * *' # Start ook automatisch elke nacht om 00:00 uur

jobs:
  run-gemini:
    runs-on: ubuntu-latest
    steps:
      - name: Projectcode en data ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-python: '3.10'

      - name: Google GenAI Bibliotheek installeren
        run: pip install google-genai

      - name: Gemini aanroepen met de nieuwste data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import os
          from google import genai

          # Initialiseer de client met je geheime sleutel
          client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])

          # Hier lezen we bijvoorbeeld een databestand uit je repository
          # Pas 'data.txt' of 'data.json' aan naar jouw eigen bestand
          with open('data.txt', 'r') as f:
              live_data = f.read()

          prompt = f'Analyseer de volgende live data en geef een update: {live_data}'

          # We gebruiken het snelle en gratis gemini-2.5-flash model
          response = client.models.generate_content(
              model='gemini-2.5-flash',
              contents=prompt,
          )

          print('--- RESULTAAT VAN GEMINI ---')
          print(response.text)
          "
