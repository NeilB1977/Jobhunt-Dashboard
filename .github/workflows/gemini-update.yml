name: Gemini Live Dashboard Update

on:
  push:
    branches: [ main ]  # Start zodra je data.txt of code aanpast
  schedule:
    - cron: '0 0 * * *' # Elke nacht om 00:00 uur

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Projectcode ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Google GenAI installeren
        run: pip install google-genai

      - name: Dashboard genereren via Gemini Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_dashboard.py

      - name: Dashboard pushen naar GitHub Pages
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git diff-index --quiet HEAD || (git commit -m "Automatische dashboard update door Gemini" && git push)
